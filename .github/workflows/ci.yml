name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  test:
    name: Bun ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint code
        run: bun run lint

      - name: Lint docs
        run: bun run lint:docs

      - name: Typecheck
        run: bun run typecheck

      - name: Knip dead code analysis
        run: bun run knip

      - name: Test and coverage
        run: bun run test:coverage

      - name: Check the published file set
        if: runner.os == 'Linux'
        run: bun pm pack --dry-run
